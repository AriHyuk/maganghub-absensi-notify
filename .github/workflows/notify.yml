name: Check MagangHub Absensi & Gajian Status

on:
  schedule:
    # [TESTING] Sekali jam 19:10 WIB (12:10 UTC)
    - cron: '10 12 * * *'

    # [TESTING] Sekali jam 19:55 WIB (12:55 UTC)
    - cron: '55 12 * * *'

    # 1. Alarm pagi jam 05:00 WIB (22:00 UTC) setiap hari untuk salam pagi & motivasi gajian
    - cron: '0 22 * * *'

    # 2. Trigger berkala jam kerja: Senin - Jumat, tiap 30 menit (08:00 - 18:00 WIB = 01:00 - 11:00 UTC)
    # Termasuk pengingat jam 15:00 WIB (08:00 UTC) untuk laporan harian
    - cron: '*/30 1-11 * * 1-5'

  # Izinkan trigger manual dari tab 'Actions' di GitHub
  workflow_dispatch:

jobs:
  check-absensi:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Restore notification state cache
        uses: actions/cache@v4
        with:
          path: .state.json
          # Pakai tanggal sebagai key supaya state persist dalam 1 hari (tidak reset tiap commit)
          key: state-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            state-${{ runner.os }}-

      - name: Trigger proactive keep-alive refresh on Vercel
        run: |
          curl -s https://maganghub-absensi-notify.vercel.app/api/refresh || true

      - name: Run status check
        env:
          AUTH_TOKEN: ${{ secrets.AUTH_TOKEN }}
          PARTICIPANT_ID: ${{ secrets.PARTICIPANT_ID }}
          SCHEDULE_ID: ${{ secrets.SCHEDULE_ID }}
          PERIOD_START: ${{ secrets.PERIOD_START }}
          COOKIE: ${{ secrets.COOKIE }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: node main.js --once
